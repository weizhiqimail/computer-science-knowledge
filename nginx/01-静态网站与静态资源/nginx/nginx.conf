# 本文件放在 nginx.conf 的 http 块内，或由 http 块中的 include 指令加载。

proxy_cache_path CACHE_ROOT levels=1:2 keys_zone=demo_cache:10m inactive=10m max_size=200m; # 定义代理缓存目录、目录层级、共享内存区、闲置时间和最大容量

server { # 实验一：传统静态网站
    listen 8081; # 监听静态网站实验端口
    server_name localhost; # 只匹配本机测试域名
    root STATIC_ROOT/site; # 指向传统静态网站根目录，使用前替换 STATIC_ROOT
    index index.html; # 目录请求默认查找 index.html

    location / { # 处理普通页面、文档和下载文件
        try_files $uri $uri/ =404; # 只返回真实存在的文件或目录，不存在时返回 404
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|svg|woff2?)$ { # 匹配常见静态资源扩展名，忽略大小写
        try_files $uri =404; # 静态资源必须真实存在，防止错误回退到 HTML
        expires 7d; # 告诉浏览器资源七天后过期
        add_header Cache-Control "public"; # 允许浏览器和共享缓存保存公开资源
    }
}

server { # 实验二：单页应用路由回退
    listen 8082; # 监听 SPA 实验端口
    server_name localhost; # 只匹配本机测试域名
    root STATIC_ROOT/spa; # 指向 SPA 构建产物目录，使用前替换 STATIC_ROOT
    index index.html; # 默认入口文件

    location / { # 处理浏览器页面路由
        try_files $uri $uri/ /index.html; # 真实文件优先，不存在时交给 SPA 入口处理
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|svg|woff2?)$ { # 单独处理 SPA 静态资源
        try_files $uri =404; # 资源不存在时返回 404，不能返回入口 HTML
        expires 7d; # 为构建资源设置浏览器缓存时间
        add_header Cache-Control "public"; # 允许公开缓存静态资源
    }

    location = /index.html { # 精确匹配 SPA 入口文件
        add_header Cache-Control "no-cache"; # 每次验证入口文件是否更新，避免引用旧版本资源
    }
}

server { # 实验三：代理缓存公开响应并绕过私有响应
    listen 8083; # 监听代理缓存实验端口
    server_name localhost; # 只匹配本机测试域名

    location /public-data { # 公开且允许短期缓存的动态接口
        proxy_pass http://127.0.0.1:3100; # 转发给 Node 动态源站并保留原路径
        proxy_cache demo_cache; # 使用文件顶部定义的共享缓存区
        proxy_cache_valid 200 30s; # 对成功响应缓存三十秒
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504; # 上游异常或更新期间允许使用旧缓存
        proxy_cache_background_update on; # 返回旧缓存的同时在后台更新缓存
        add_header X-Cache-Status $upstream_cache_status always; # 输出 MISS、HIT、STALE 等缓存状态，便于观察
    }

    location /private-data { # 包含私有信息、不能进入共享缓存的接口
        proxy_pass http://127.0.0.1:3100; # 转发到同一个 Node 源站
        proxy_no_cache 1; # 禁止把当前响应写入代理缓存
        proxy_cache_bypass 1; # 禁止从代理缓存读取当前请求
    }
}

server { # 实验四：文本响应压缩
    listen 8084; # 监听 gzip 实验端口
    server_name localhost; # 只匹配本机测试域名
    root STATIC_ROOT/site; # 复用传统静态网站目录，使用前替换 STATIC_ROOT

    gzip on; # 启用 gzip 响应压缩
    gzip_vary on; # 添加 Vary: Accept-Encoding，避免缓存混用压缩和未压缩响应
    gzip_min_length 1024; # 小于一千字节的响应不压缩，避免收益低于计算成本
    gzip_comp_level 5; # 使用中等压缩等级，平衡 CPU 和传输体积
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml; # 只压缩适合压缩的文本格式，不重复压缩图片、视频和压缩包

    location / { # 提供压缩实验所需静态内容
        try_files $uri $uri/ =404; # 只返回真实存在的文件或目录
    }
}
