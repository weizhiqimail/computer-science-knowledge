# 本文件放在 nginx.conf 的 http 块内，或由 http 块中的 include 指令加载。

server { # 实验一：把明文 HTTP 统一跳转到 HTTPS
    listen 80; # 监听标准 HTTP 端口
    server_name secure.demo.local; # 匹配 HTTPS 实验域名
    return 301 https://$host$request_uri; # 永久跳转并保留原路径及查询参数
}

server { # 实验二：HTTPS入口和TLS终止
    listen 443 ssl; # 在标准 HTTPS 端口启用 TLS
    http2 on; # 启用 HTTP/2，较旧 Nginx 可改用 listen 443 ssl http2
    server_name secure.demo.local; # 匹配证书对应的实验域名

    ssl_certificate CERT_ROOT/secure.demo.local.fullchain.pem; # 加载完整证书链，使用前替换 CERT_ROOT
    ssl_certificate_key CERT_ROOT/secure.demo.local.key; # 加载私钥，必须限制文件读取权限
    ssl_protocols TLSv1.2 TLSv1.3; # 只允许现代 TLS 协议版本
    ssl_session_cache shared:TLS:10m; # 建立共享 TLS 会话缓存以减少重复握手成本
    ssl_session_timeout 10m; # 会话缓存有效十分钟
    ssl_session_tickets off; # 关闭会话票据，避免未轮换票据密钥带来的风险
    add_header Strict-Transport-Security "max-age=31536000" always; # 告诉浏览器一年内只使用 HTTPS，正式启用前必须确认站点始终支持 HTTPS

    location / { # 把解密后的请求交给内部应用
        proxy_pass http://127.0.0.1:3201; # 代理到 Node1 示例服务
        proxy_set_header Host $host; # 传递原始域名
        proxy_set_header X-Real-IP $remote_addr; # 传递当前客户端地址
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; # 追加代理链客户端地址
        proxy_set_header X-Forwarded-Proto https; # 告知后端客户端原始协议为 HTTPS
    }
}

server { # 实验三：IP白名单与黑名单
    listen 8088; # 监听访问控制实验端口
    server_name admin.demo.local; # 匹配管理入口测试域名

    location /admin/ { # 管理入口采用严格白名单
        allow 127.0.0.1; # 允许本机访问
        allow 10.10.0.0/16; # 允许示例办公网段，实际使用必须替换
        allow 2001:db8:1234::/48; # 允许示例 IPv6 网段，实际使用必须替换
        deny all; # 拒绝所有未命中白名单的来源
        proxy_pass http://127.0.0.1:3203; # 把允许的管理请求交给 Node3
        proxy_set_header Host $host; # 传递原始域名
        proxy_set_header X-Real-IP $remote_addr; # 传递经过可信代理处理后的真实地址
    }

    location / { # 普通入口采用黑名单
        deny 203.0.113.0/24; # 拒绝示例恶意网段，实际使用必须替换
        allow all; # 允许其他来源
        proxy_pass http://127.0.0.1:3201; # 把允许的普通请求交给 Node1
    }
}
