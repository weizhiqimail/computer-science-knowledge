# 本文件放在 nginx.conf 的 http 块内，或由 http 块中的 include 指令加载。

map $http_upgrade $connection_upgrade { # 根据客户端是否请求协议升级生成 Connection 头
    default upgrade; # 存在 Upgrade 头时向上游发送 upgrade
    '' close; # 普通 HTTP 请求使用 close
}

upstream grpc_nodes { # 定义 gRPC 服务池，后续可继续加入多个实例
    server 127.0.0.1:50051; # Node gRPC 示例服务
    keepalive 16; # 保留十六条到 gRPC 上游的空闲连接
}

server { # 实验一：WebSocket和SSE长连接
    listen 8090; # 监听浏览器实时通信实验端口
    server_name localhost; # 匹配本机测试域名
    root STATIC_ROOT; # 指向本任务 static 目录，使用前替换 STATIC_ROOT

    location = / { # 返回浏览器测试页面
        try_files /index.html =404; # 只返回真实存在的入口文件
    }

    location /ws { # WebSocket协议升级入口
        proxy_pass http://127.0.0.1:3500; # 代理到 Node WebSocket 服务
        proxy_http_version 1.1; # WebSocket 升级使用 HTTP/1.1
        proxy_set_header Upgrade $http_upgrade; # 转发客户端 Upgrade 请求头
        proxy_set_header Connection $connection_upgrade; # 根据 map 结果设置 Connection 请求头
        proxy_read_timeout 1h; # 最长一小时没有上游数据后关闭连接
        proxy_send_timeout 1h; # 最长一小时无法向上游写入数据后关闭连接
    }

    location /events { # SSE事件流入口
        proxy_pass http://127.0.0.1:3500; # 代理到 Node SSE 服务
        proxy_http_version 1.1; # 使用 HTTP/1.1 保持事件流连接
        proxy_buffering off; # 禁止聚合响应，事件生成后立即发送给浏览器
        proxy_cache off; # 禁止缓存持续变化的事件流
        proxy_read_timeout 1h; # 最长一小时没有事件后关闭连接
        add_header X-Accel-Buffering no; # 明确告诉代理链不要缓冲事件流
    }
}

server { # 实验二：gRPC一元调用和服务端流式调用
    listen 8091 http2; # 使用明文 HTTP/2 监听 gRPC 实验端口
    server_name localhost; # 匹配本机测试域名

    location /demo.RealtimeService/ { # 按 proto 中的完整服务名匹配 gRPC 方法
        grpc_pass grpc://grpc_nodes; # 使用 gRPC 协议代理到服务池
        grpc_connect_timeout 5s; # 连接 gRPC 上游最多等待五秒
        grpc_read_timeout 1h; # 支持最长一小时没有数据的服务端流
        grpc_send_timeout 1h; # 支持最长一小时无法写入上游的调用
        grpc_set_header X-Real-IP $remote_addr; # 把当前客户端地址作为 gRPC 元数据传给上游
    }
}
