# 本文件放在 nginx.conf 的 http 块内，或由 http 块中的 include 指令加载。

server { # 文件上传与大请求体实验
    listen 8089; # 监听上传实验端口
    server_name localhost; # 匹配本机测试域名
    root STATIC_ROOT; # 指向本任务 static 目录，使用前替换 STATIC_ROOT

    location = / { # 精确匹配上传页面入口
        try_files /index.html =404; # 返回静态上传测试页面
    }

    location /upload { # 只对上传接口放宽请求体和超时限制
        client_max_body_size 100m; # Nginx 最多接收 100 MiB 请求体
        client_body_timeout 120s; # 客户端发送请求体的两次读取之间最多等待 120 秒
        proxy_connect_timeout 5s; # 连接 Node 上传服务最多等待五秒
        proxy_send_timeout 120s; # 向 Node 发送请求的两次写操作之间最多等待 120 秒
        proxy_read_timeout 120s; # 从 Node 读取响应的两次读操作之间最多等待 120 秒
        proxy_request_buffering off; # 边接收边转发，避免 Nginx 完整缓存请求体后才请求上游
        proxy_pass http://127.0.0.1:3400; # 转发给 Express/Multer 上传服务
        proxy_set_header Host $host; # 传递原始域名
        proxy_set_header X-Real-IP $remote_addr; # 传递当前客户端地址
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; # 追加完整代理链地址
    }
}
