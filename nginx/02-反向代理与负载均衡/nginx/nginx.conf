# 本文件放在 nginx.conf 的 http 块内，或由 http 块中的 include 指令加载。

upstream main_nodes { # 定义主站负载均衡池
    least_conn; # 优先选择当前连接数较少的实例
    server 127.0.0.1:3201 max_fails=3 fail_timeout=10s; # Node1，连续失败后短暂避开
    server 127.0.0.1:3202 max_fails=3 fail_timeout=10s; # Node2，连续失败后短暂避开
    keepalive 16; # 保留十六条到上游的空闲长连接
}

limit_req_zone $binary_remote_addr zone=api_rate:10m rate=5r/s; # 按客户端 IP 建立请求速率共享区，平均每秒五次
limit_conn_zone $binary_remote_addr zone=per_ip_conn:10m; # 按客户端 IP 建立并发连接计数共享区

server { # 实验一：反向代理与负载均衡
    listen 8085; # 监听负载均衡实验端口
    server_name localhost; # 匹配本机测试域名

    location / { # 所有主站请求进入 Node1/Node2 池
        proxy_pass http://main_nodes; # 把请求交给主站负载均衡池
        proxy_http_version 1.1; # 上游使用 HTTP/1.1，支持连接复用
        proxy_set_header Host $host; # 把原始域名传给后端
        proxy_set_header X-Real-IP $remote_addr; # 把当前客户端地址传给后端
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; # 追加完整代理链地址
        proxy_set_header X-Forwarded-Proto $scheme; # 告知后端客户端使用的原始协议
        proxy_set_header Connection ""; # 清除 hop-by-hop Connection 头以复用上游连接
    }
}

server { # 实验二：同一域名按路径分流
    listen 8086; # 与下一个 server 共用端口，由 Host 决定匹配项
    server_name app.demo.local; # 主站测试域名

    location /api/ { # API 路径交给 Node3
        proxy_pass http://127.0.0.1:3203; # 保留 /api/ 原路径转发到 Node3
        proxy_set_header Host $host; # 把原始域名传给 Node3
    }

    location /admin { # 管理页面路径交给 Node3
        proxy_pass http://127.0.0.1:3203; # 保留 /admin 原路径转发到 Node3
        proxy_set_header Host $host; # 把原始域名传给 Node3
    }

    location / { # 其他主站页面交给 Node1/Node2
        proxy_pass http://main_nodes; # 使用负载均衡池提供普通页面
        proxy_set_header Host $host; # 把原始域名传给后端
    }
}

server { # 实验三：同一端口按域名分流
    listen 8086; # 与 app.demo.local 共用端口
    server_name api.demo.local; # API 专用测试域名

    location / { # API 域名下的全部请求
        proxy_pass http://127.0.0.1:3203; # 全部交给 Node3
        proxy_set_header Host $host; # 把 API 域名传给 Node3
    }
}

server { # 实验四：请求限流、并发限制和 CORS
    listen 8087; # 监听流量治理实验端口
    server_name localhost; # 匹配本机测试域名

    location /api/ { # 只对 API 路径应用限制和跨域策略
        limit_req zone=api_rate burst=10 nodelay; # 平均每秒五次，允许瞬时突发十次但不排队
        limit_conn per_ip_conn 10; # 每个客户端 IP 最多保持十个并发连接
        limit_req_status 429; # 请求频率超限时返回 429

        if ($request_method = OPTIONS) { # 只用 if 判断预检方法并立即返回，不执行复杂重写
            add_header Access-Control-Allow-Origin "http://frontend.demo.local" always; # 允许指定前端来源
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always; # 声明允许的请求方法
            add_header Access-Control-Allow-Headers "Content-Type, Authorization" always; # 声明允许的请求头
            add_header Access-Control-Max-Age 600 always; # 浏览器可缓存预检结果十分钟
            return 204; # 预检成功且不返回响应体
        }

        add_header Access-Control-Allow-Origin "http://frontend.demo.local" always; # 为实际请求添加允许来源
        add_header Access-Control-Allow-Credentials "true" always; # 允许浏览器携带凭证
        add_header Vary "Origin" always; # 提醒缓存按 Origin 区分响应
        proxy_pass http://127.0.0.1:3203; # 把实际 API 请求转发给 Node3
        proxy_set_header Host $host; # 把原始域名传给 Node3
    }
}
